<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HL7 Lookup</title>
  <link rel="icon" href="/icons/hl7.png">
  <script type="importmap">{"imports":{"@js-joda/core":"/js-joda.esm.js"}}</script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1520; }
    #loading {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      background: #0e1520;
      transition: opacity .45s ease;
    }
    #loading.out { opacity: 0; pointer-events: none; }
    .splash { position: relative; display: flex; flex-direction: column; align-items: center; }
    .halo {
      position: absolute; top: 18px; width: 240px; height: 240px; border-radius: 50%;
      background: radial-gradient(circle, rgba(47,127,209,.28), transparent 68%);
      animation: pulse 2.6s ease-in-out infinite;
    }
    .mark { position: relative; width: 148px; height: 148px; overflow: visible; }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.05s cubic-bezier(.16,.8,.24,1) forwards; }
    .fade { opacity: 0; animation: rise .55s ease forwards; }
    .word {
      position: relative; margin-top: 18px;
      font: 600 30px/1 "Segoe UI", system-ui, sans-serif;
      letter-spacing: -0.04em; color: #d8e1ec;
      opacity: 0; transform: translateY(8px);
      animation: rise .55s .45s ease forwards;
    }
    .word span { color: #6eb6f0; margin-left: 8px; }
    .tag {
      position: relative; margin-top: 8px;
      color: #8a9ab0; font: 14px/1.4 system-ui, sans-serif;
      opacity: 0; transform: translateY(8px);
      animation: rise .55s .7s ease forwards;
    }
    .track {
      position: relative; width: 168px; height: 2px; margin-top: 22px;
      border-radius: 2px; background: #1a2636; overflow: hidden;
    }
    .track i {
      display: block; height: 100%; width: 36%;
      background: linear-gradient(90deg, transparent, #6eb6f0, transparent);
      animation: sweep 1.3s ease-in-out infinite;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes sweep { from { transform: translateX(-140%); } to { transform: translateX(380%); } }
    @keyframes pulse {
      0%, 100% { transform: scale(.92); opacity: .65; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .fade, .word, .tag { animation: none; opacity: 1; transform: none; }
      .halo, .track i { animation: none; }
      .track i { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="splash">
      <div class="halo"></div>
      <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="fade" cx="60" cy="60" r="52" fill="#141E2B" style="animation-delay:.05s"/>
        <circle class="draw" pathLength="1" cx="60" cy="60" r="52" fill="none" stroke="#2A3A50" stroke-width="1.5" style="animation-delay:.08s"/>
        <rect class="fade" x="38" y="30" width="44" height="56" rx="6" fill="#0B1118" style="animation-delay:.16s"/>
        <rect class="draw" pathLength="1" x="38" y="30" width="44" height="56" rx="6" fill="none" stroke="#6EB6F0" stroke-width="1.7" style="animation-delay:.2s"/>
        <path class="draw" pathLength="1" d="M48 46 V74" fill="none" stroke="#6EB6F0" stroke-width="2.2" stroke-linecap="round" style="animation-delay:.4s"/>
        <path class="draw" pathLength="1" d="M54 48 H74" fill="none" stroke="#F26D85" stroke-width="3" stroke-linecap="round" style="animation-delay:.52s"/>
        <path class="draw" pathLength="1" d="M54 58 H70" fill="none" stroke="#7FE6D8" stroke-width="3" stroke-linecap="round" style="animation-delay:.64s"/>
        <path class="draw" pathLength="1" d="M54 68 H66" fill="none" stroke="#8FA8F2" stroke-width="3" stroke-linecap="round" style="animation-delay:.76s"/>
        <circle class="fade" cx="78" cy="78" r="12" fill="#0E1520" style="animation-delay:.84s"/>
        <circle class="draw" pathLength="1" cx="78" cy="78" r="12" fill="none" stroke="#2F7FD1" stroke-width="2" style="animation-delay:.84s"/>
        <path class="draw" pathLength="1" d="M86 86 L96 96" fill="none" stroke="#2F7FD1" stroke-width="2.2" stroke-linecap="round" style="animation-delay:.98s"/>
      </svg>
      <div class="word">HL7 <span>Lookup</span></div>
      <div class="tag" id="splash-tag">Read, edit and send HL7 v2</div>
      <div class="track"><i></i></div>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('loading');
      el.dataset.started = String(performance.now());
      try {
        var raw = localStorage.getItem('hl7lookup.settings.v1');
        if (raw && JSON.parse(raw).language === 'DE') {
          document.getElementById('splash-tag').textContent = 'HL7 v2 lesen, bearbeiten und senden';
        }
      } catch (e) {}
      var appReady = false;
      var timer = 0;
      function leave() {
        if (!el || el.classList.contains('out')) return;
        el.classList.add('out');
        setTimeout(function () { el.remove(); }, 480);
      }
      window.__hl7Ready = function () {
        if (appReady) return;
        appReady = true;
        var started = Number(el.dataset.started || 0);
        var wait = Math.max(0, 1680 - (performance.now() - started));
        timer = setTimeout(leave, wait);
      };
      el.addEventListener('pointerdown', function () {
        if (!appReady) return;
        clearTimeout(timer);
        leave();
      });
    })();
  </script>
  <script type="module">
    import '/web.mjs';
  </script>
</body>
</html>
